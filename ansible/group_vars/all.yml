---
# App
app_user: fixmyquery
app_group: fixmyquery
app_home: /opt/fixmyquery
app_repo: https://github.com/k3roulas/fixmyquery.git
app_branch: main
app_port: 3002

# Public endpoint: bare IP + path prefix (no domain → HTTP only).
# The IP is vault-sourced so it never lands in the public repo.
server_ip: "{{ vault_server_ip }}"
base_path: /FixMyQuery
# Public origin used for absolute links in emails (proxy headers are unreliable)
app_origin: "http://{{ server_ip }}"

# PostgreSQL (own database on the shared instance; other databases untouched)
postgres_user: fixmyquery
postgres_password: "{{ vault_postgres_password }}"
postgres_db: fixmyquery

# Auth
jwt_secret: "{{ vault_jwt_secret }}"
# Served over plain HTTP on a bare IP → session cookie must not be Secure
cookie_secure: "false"

# AI provider (Z.ai coding endpoint)
ai_base_url: https://api.z.ai/api/coding/paas/v4/
ai_model: glm-5.3
ai_thinking: disabled
ai_api_key: "{{ vault_ai_api_key }}"

# SMTP (Brevo relay, same account as altqr)
smtp_host: "{{ vault_smtp_host }}"
smtp_port: 587
smtp_user: "{{ vault_smtp_user }}"
smtp_password: "{{ vault_smtp_password }}"
smtp_from: noreply@altqr.cc

# Slack notifications (same workspace as altqr)
slack_webhook_url: "{{ vault_slack_webhook_url }}"
