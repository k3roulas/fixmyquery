services:
  postgres:
    image: postgres:17-alpine
    container_name: fixmyquery-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fixmyquery
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fixmyquery']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: fixmyquery-mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    volumes:
      - mailpitdata:/data

volumes:
  pgdata:
  mailpitdata:
